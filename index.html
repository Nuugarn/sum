function loadTasks(){try{var raw=localStorage.getItem(STORAGE_KEY);if(!raw){var s=seedTasks();localStorage.setItem(STORAGE_KEY,JSON.stringify(s));return{ok:true,tasks:s}}var p=JSON.parse(raw);return Array.isArray(p)?{ok:true,tasks:p}:{ok:false,tasks:[]}}catch(e){return{ok:false,tasks:[]}}}function saveTasks(x){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(x));return true}catch(e){return false}}
var state={loading:true,loadError:false,tasks:[],categories:loadCategories(),filter:"school",view:"list",activeTaskId:null,editingTaskId:null,confirmDeleteId:null,menuOpen:false,topicManager:false,formErrors:{}};var app=document.getElementById("app");
function counts(){var c={};Object.keys(state.categories).forEach(function(k){c[k]=state.tasks.filter(function(t){return t.category===k}).length});c.important=state.tasks.filter(function(t){return t.important}).length;return c}function filteredTasks(){return sortTasks(state.tasks.filter(function(t){if(state.filter==="important")return t.important===true;return t.category===state.filter}))}function sortTasks(a){return a.slice().sort(function(x,y){var xd=x.status==="done",yd=y.status==="done";if(xd!==yd)return xd?1:-1;var xo=isOverdue(x),yo=isOverdue(y);if(!xd&&!yd&&xo!==yo)return xo?-1:1;return new Date(x.dueAt)-new Date(y.dueAt)})}
function render(){var c=counts(),html=renderTopbar()+"<div class=\"layout\">"+renderTabs(c)+"<main class=\"content\" id=\"content\">"+renderMain()+"</main></div>"+renderFab()+renderConfirmOverlay()+renderTopicManager()+renderMenu();app.innerHTML=html;bindEvents()}
function renderTopbar(){return'<header class="topbar"><button class="menu-btn" data-action="toggle-menu" aria-label="เมนู">'+ICONS.menu+'</button><div class="brand"><span class="brand-mark">'+ICONS.check+'</span><div><h1>Task Index</h1><div class="sub">งานของฉัน</div></div></div><button class="btn header-add" data-action="new-task">'+ICONS.plus+' เพิ่มงาน</button></header>'}
function renderTabs(c){var html='<nav class="tabs" aria-label="หัวข้อ">';Object.keys(state.categories).forEach(function(k){var cat=state.categories[k],active=state.view!=="form"&&state.filter===k;html+='<button class="'+(active?"active":"")+'" style="--tab-color:'+safeColor(cat.color)+'" data-action="set-filter" data-filter="'+escapeHtml(k)+'" aria-pressed="'+(state.filter===k)+'"><span class="topic-dot"></span>'+escapeHtml(cat.label)+'<span class="count">'+(c[k]||0)+' งาน</span></button>'});html+='<button class="'+(state.filter==="important"?"active":"")+'" style="--tab-color:#6B8E7B" data-action="set-filter" data-filter="important" aria-pressed="'+(state.filter==="important")+'"><span class="topic-dot"></span>สำคัญ<span class="count">'+c.important+' งาน</span></button>';return html+'</nav>'}
function renderMain(){if(state.loading)return'<div class="state-block"><p>กำลังโหลด...</p></div>';if(state.loadError)return'<div class="state-block">'+ICONS.warn+'<p class="lead">ไม่สามารถโหลดงานได้</p><p>พื้นที่จัดเก็บของเบราว์เซอร์ไม่พร้อมใช้งาน</p><button class="btn secondary" data-action="retry-load">ลองอีกครั้ง</button></div>';if(state.view==="detail")return renderDetail();if(state.view==="form")return renderForm();return renderList()}
function renderList(){var tasks=filteredTasks(),heading=state.filter==="important"?"สำคัญ":(state.categories[state.filter]?state.categories[state.filter].label:state.filter),html='<div class="list-head"><h2>'+escapeHtml(heading)+'</h2><span class="hint">'+tasks.length+' งาน</span></div>';if(!tasks.length)return html+renderEmptyState();html+='<ul class="task-list">';tasks.forEach(function(t){html+=renderTaskCard(t)});return html+'</ul>'}function renderEmptyState(){return'<div class="state-block">'+ICONS.inbox+'<p class="lead">ยังไม่มีงาน</p><p>สร้างงานแรกของหัวข้อนี้</p><button class="btn" data-action="new-task">'+ICONS.plus+' เพิ่มงาน</button></div>'}
function renderTaskCard(t){var cat=state.categories[t.category]||{label:t.category||"ไม่ระบุ",color:"#6B8E7B"},cd=computeCountdown(t.dueAt,t.status),overdue=isOverdue(t),star=t.important?ICONS.star:ICONS.starOutline;return'<li><button class="task-card'+(overdue?" is-overdue":"")+(t.status==="done"?" is-done":"")+'" style="--category-color:'+safeColor(cat.color)+'" data-action="open-task" data-id="'+escapeHtml(t.id)+'"><div class="card-head"><span class="star'+(t.important?"":" off")+'">'+star+'</span><span class="title">'+escapeHtml(t.title)+'</span><span class="chev">'+ICONS.chev+'</span></div><div class="card-body"><div class="card-meta"><span class="pill" style="background:'+safeColor(cat.color)+'22;color:'+safeColor(cat.color)+'">'+escapeHtml(cat.label)+'</span><span class="pill status-'+t.status+'">'+escapeHtml(STATUS_LABELS[t.status]||t.status)+'</span>'+(overdue?'<span class="pill overdue">เลยกำหนด</span>':"")+(t.status!=="done"?'<span class="due-text'+(overdue?" urgent":"")+'">กำหนดส่ง '+formatDueShort(t.dueAt)+'</span>':"")+'</div></div></button></li>'}
function renderDetail(){var t=state.tasks.find(function(x){return x.id===state.activeTaskId});if(!t){state.view="list";return renderList()}var cat=state.categories[t.category]||{label:t.category||"ไม่ระบุ",color:"#6B8E7B"},cd=computeCountdown(t.dueAt,t.status),star=t.important?ICONS.star:ICONS.starOutline,html='<div class="detail"><div class="detail-topbar"><button class="back-link" data-action="back-to-list">'+ICONS.back+' กลับ</button></div><div class="detail-card" style="--category-color:'+safeColor(cat.color)+'"><div class="detail-header"><span class="star'+(t.important?"":" off")+'">'+star+'</span><h2>'+escapeHtml(t.title)+'</h2></div><div class="detail-body">';html+=field("สถานะ",'<span class="pill status-'+t.status+'">'+escapeHtml(STATUS_LABELS[t.status]||t.status)+'</span>');html+=field("หัวข้อ",escapeHtml(cat.label));html+=field("ความสำคัญ",t.important?"⭐ สำคัญ":"ไม่ได้ทำเครื่องหมายว่าสำคัญ");html+=field("รายละเอียด",t.description?escapeHtml(t.description):'<span class="value muted">ไม่มีรายละเอียดเพิ่มเติม</span>');html+=field("กำหนดส่ง",formatDueFullDate(t.dueAt)+"<br>"+formatDueFullTime(t.dueAt));html+='<div class="field"><div class="label">เวลาที่เหลือ</div><div class="countdown-box '+cd.state+'">'+(cd.state==="done"?ICONS.check:ICONS.clock)+' '+escapeHtml(cd.text)+'</div></div></div><div class="detail-actions"><button class="btn secondary" data-action="edit-task" data-id="'+escapeHtml(t.id)+'">'+ICONS.edit+' แก้ไข</button>'+(t.status!=="done"?'<button class="btn" data-action="mark-done" data-id="'+escapeHtml(t.id)+'">'+ICONS.check+' ทำเสร็จแล้ว</button>':"")+'<button class="btn danger" data-action="ask-delete" data-id="'+escapeHtml(t.id)+'">'+ICONS.trash+' ลบ</button></div></div></div>';return html}function field(l,v){return'<div class="field"><div class="label">'+escapeHtml(l)+'</div><div class="value">'+v+'</div></div>'}
function renderForm(){var editing=!!state.editingTaskId,t=editing?state.tasks.find(function(x){return x.id===state.editingTaskId}):{title:"",category:state.filter!=="important"&&state.categories[state.filter]?state.filter:"school",important:false,description:"",status:"todo",dueAt:""};if(!t){state.view="list";return renderList()}var dd="",dt="";if(t.dueAt){var d=new Date(t.dueAt);if(!isNaN(d)){dd=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());dt=pad(d.getHours())+":"+pad(d.getMinutes())}}var errs=state.formErrors||{};function er(n){return errs[n]?" error":""}function em(n){return errs[n]?'<div class="err-msg">'+escapeHtml(errs[n])+'</div>':""}var options=Object.keys(state.categories).map(function(k){return'<option value="'+escapeHtml(k)+'"'+(t.category===k?" selected":"")+'>'+escapeHtml(state.categories[k].label)+'</option>'}).join('');return'<div class="form-wrap"><div class="detail-topbar"><button class="back-link" data-action="cancel-form">'+ICONS.back+' ยกเลิก</button></div><form class="task-form" id="task-form" novalidate><div class="form-row'+er("title")+'"><label for="f-title">ชื่อ</label><input id="f-title" name="title" type="text" value="'+escapeHtml(t.title)+'" placeholder="เช่น รายงานวิทยาศาสตร์">'+em("title")+'</div><div class="form-grid-2"><div class="form-row"><label for="f-category">หัวข้อ</label><select id="f-category" name="category">'+options+'</select></div><div class="form-row"><label for="f-status">สถานะ</label><select id="f-status" name="status">'+["todo","in_progress","done"].map(function(s){return'<option value="'+s+'"'+(t.status===s?" selected":"")+'>'+STATUS_LABELS[s]+'</option>'}).join('')+'</select></div></div><div class="form-row checkbox-row"><input id="f-important" name="important" type="checkbox"'+(t.important?" checked":"")+'><label for="f-important">งานสำคัญ</label></div><div class="form-row"><label for="f-description">รายละเอียด</label><textarea id="f-description" name="description" placeholder="รายละเอียดของงาน">'+escapeHtml(t.description||"")+'</textarea></div><div class="form-grid-2"><div class="form-row'+er("dueDate")+'"><label for="f-due-date">กำหนดวันที่</label><input id="f-due-date" name="dueDate" type="date" value="'+dd+'">'+em("dueDate")+'</div><div class="form-row'+er("dueTime")+'"><label for="f-due-time">กำหนดเวลา</label><input id="f-due-time" name="dueTime" type="time" value="'+dt+'">'+em("dueTime")+'</div></div><div class="form-actions"><button type="button" class="btn secondary" data-action="cancel-form">ยกเลิก</button><button type="submit" class="btn">'+(editing?"บันทึกการแก้ไข":"สร้างงาน")+'</button></div></form></div>'}
function renderFab(){return state.view==="form"||state.loading?"":'<button class="fab" data-action="new-task" aria-label="เพิ่มงาน">'+ICONS.plus+'</button>'}function renderConfirmOverlay(){if(!state.confirmDeleteId)return"";var t=state.tasks.find(function(x){return x.id===state.confirmDeleteId});if(!t)return"";return'<div class="overlay" data-action="overlay-bg"><div class="confirm-box" role="dialog" aria-modal="true"><p>ต้องการลบงาน “'+escapeHtml(t.title)+'” หรือไม่?</p><div class="row"><button class="btn secondary" data-action="cancel-delete">ยกเลิก</button><button class="btn danger" data-action="confirm-delete">ลบ</button></div></div></div>'}
function renderMenu(){if(!state.menuOpen)return"";return'<div class="menu-panel"><button data-action="add-topic">'+ICONS.plus+' เพิ่มหัวข้อ</button><button data-action="manage-topics">'+ICONS.settings+' จัดการหัวข้อ</button></div>'}
function renderTopicManager(){if(!state.topicManager)return"";var rows=Object.keys(state.categories).map(function(k){var c=state.categories[k];return'<div class="topic-row"><input type="text" data-topic-name="'+escapeHtml(k)+'" value="'+escapeHtml(c.label)+'" aria-label="ชื่อหัวข้อ"><input type="color" data-topic-color="'+escapeHtml(k)+'" value="'+safeColor(c.color)+'" aria-label="สีหัวข้อ"><button class="btn secondary topic-save" data-action="save-topic" data-topic="'+escapeHtml(k)+'">บันทึก</button></div>'}).join('');return'<div class="overlay" data-action="close-topic-manager"><div class="topic-manager" role="dialog" aria-modal="true"><h3>จัดการหัวข้อ</h3><div class="muted">เปลี่ยนชื่อและสีของแต่ละหัวข้อได้</div>'+rows+'<div class="topic-add"><h4>เพิ่มหัวข้อใหม่</h4><div class="topic-add-grid"><input id="new-topic-name" type="text" placeholder="เช่น ส่วนตัว"><input id="new-topic-color" type="color" value="#6B8E7B" aria-label="สีใหม่"></div><button class="btn full" data-action="create-topic">'+ICONS.plus+' เพิ่มหัวข้อ</button></div><div class="form-actions"><button class="btn secondary" data-action="close-topic-manager">ปิด</button></div></div></div>'}
function validateForm(d){var e={};if(!d.title||!d.title.trim())e.title="กรุณาระบุชื่องาน";if(!d.dueDate)e.dueDate="กรุณาระบุวันครบกำหนด";if(!d.dueTime)e.dueTime="กรุณาระบุเวลาครบกำหนด";if(d.dueDate&&d.dueTime&&isNaN(new Date(d.dueDate+"T"+d.dueTime+":00").getTime()))e.dueDate="วันหรือเวลาไม่ถูกต้อง";if(!state.categories[d.category])e.category="หัวข้อไม่ถูกต้อง";if(!STATUS_LABELS[d.status])e.status="สถานะไม่ถูกต้อง";return e}
function handleFormSubmit(form){var d={title:form.title.value,category:form.category.value,status:form.status.value,important:form.important.checked,description:form.description.value,dueDate:form.dueDate.value,dueTime:form.dueTime.value},e=validateForm(d);if(Object.keys(e).length){state.formErrors=e;render();return}var dueAt=new Date(d.dueDate+"T"+d.dueTime+":00").toISOString();if(state.editingTaskId){var t=state.tasks.find(function(x){return x.id===state.editingTaskId});Object.assign(t,{title:d.title.trim(),category:d.category,status:d.status,important:d.important,description:d.description,dueAt:dueAt,updatedAt:nowISO()});state.activeTaskId=t.id}else{var n={id:uid(),title:d.title.trim(),category:d.category,important:d.important,description:d.description,status:d.status,dueAt:dueAt,createdAt:nowISO(),updatedAt:nowISO()};state.tasks.push(n);state.activeTaskId=n.id}saveTasks(state.tasks);state.formErrors={};state.editingTaskId=null;state.view="detail";render()}
function createTopic(){var input=document.getElementById("new-topic-name"),color=document.getElementById("new-topic-color"),name=input&&input.value.trim();if(!name)return;if(Object.keys(state.categories).some(function(k){return state.categories[k].label.toLowerCase()===name.toLowerCase()}))return;var key="topic-"+Date.now().toString(36);state.categories[key]={label:name,color:safeColor(color.value)};saveCategories();state.filter=key;state.topicManager=false;state.menuOpen=false;state.view="list";render()}
function saveTopic(id){var n=document.querySelector('[data-topic-name="'+CSS.escape(id)+'"]'),c=document.querySelector('[data-topic-color="'+CSS.escape(id)+'"]');if(!n||!n.value.trim())return;state.categories[id].label=n.value.trim();state.categories[id].color=safeColor(c.value);saveCategories();if(!state.categories[state.filter])state.filter="school";render()}
function bindEvents(){app.querySelectorAll("[data-action]").forEach(function(el){el.addEventListener("click",function(ev){var a=el.getAttribute("data-action"),id=el.getAttribute("data-id");switch(a){case"toggle-menu":state.menuOpen=!state.menuOpen;render();break;case"add-topic":state.menuOpen=false;state.topicManager=true;render();setTimeout(function(){var x=document.getElementById("new-topic-name");if(x)x.focus()},0);break;case"manage-topics":state.menuOpen=false;state.topicManager=true;render();break;case"create-topic":createTopic();break;case"save-topic":saveTopic(el.getAttribute("data-topic"));break;case"close-topic-manager":if(ev.target===el||el.getAttribute("data-action")==="close-topic-manager"){state.topicManager=false;render()}break;case"set-filter":state.filter=el.getAttribute("data-filter");state.view="list";render();break;case"open-task":state.activeTaskId=id;state.view="detail";render();window.scrollTo(0,0);break;case"back-to-list":state.view="list";state.activeTaskId=null;render();break;case"new-task":state.editingTaskId=null;state.formErrors={};state.view="form";state.menuOpen=false;render();break;case"edit-task":state.editingTaskId=id;state.formErrors={};state.view="form";render();break;case"cancel-form":state.formErrors={};state.view=state.editingTaskId?"detail":"list";state.editingTaskId=null;render();break;case"mark-done":var mt=state.tasks.find(function(x){return x.id===id});if(mt){mt.status="done";mt.updatedAt=nowISO();saveTasks(state.tasks);render()}break;case"ask-delete":state.confirmDeleteId=id;render();break;case"cancel-delete":state.confirmDeleteId=null;render();break;case"confirm-delete":state.tasks=state.tasks.filter(function(x){return x.id!==state.confirmDeleteId});saveTasks(state.tasks);state.confirmDeleteId=null;state.view="list";state.activeTaskId=null;render();break;case"overlay-bg":if(ev.target===el){state.confirmDeleteId=null;state.topicManager=false;render()}break;case"retry-load":state.loading=true;render();setTimeout(function(){var r=loadTasks();state.loading=false;state.loadError=!r.ok;state.tasks=r.tasks;render()},200);break}})});var form=document.getElementById("task-form");if(form)form.addEventListener("submit",function(ev){ev.preventDefault();handleFormSubmit(form)})}
function init(){render();setTimeout(function(){var r=loadTasks();state.loading=false;state.loadError=!r.ok;state.tasks=r.tasks;render()},150);setInterval(function(){if(!state.loading)render()},30000)}init();
})();
</script>
